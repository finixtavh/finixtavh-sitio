name: Fondo braille aleatorio

on:
  schedule:
    # 12:00 hora de Chile (UTC-3, horario de verano actual) = 15:00 UTC.
    # El cron de GitHub va en UTC y NO sigue el cambio de hora: cuando Chile
    # pase a UTC-4 (3 de abril de 2027) esto correrá a las 11:00 locales;
    # para mantener las 12:00 cámbialo a "0 16 * * *".
    - cron: "0 15 * * *"
  workflow_dispatch:         # botón "Run workflow" para probarlo a mano

permissions:
  contents: write            # necesario para que el workflow pueda hacer push

concurrency:
  group: braille-fondo
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del sitio
        uses: actions/checkout@v4

      - name: Checkout del generador
        uses: actions/checkout@v4
        with:
          repository: finixtavh/braille
          path: generador

      - name: Instalar dependencias
        run: python3 -m pip install numpy pillow

      - name: Generar imagen nueva
        id: gen
        run: |
          python3 generador/braille_gen.py --font-size 17 \
            --width 2048 --height 10240 --ink white --out-dir /tmp/braille | tee /tmp/gen.log
          SEED=$(grep -oP 'seed: \K[0-9a-f]{8}' /tmp/gen.log | head -1)
          mv /tmp/braille/braille-*-white.png img/braille.png
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/braille.png
          git diff --cached --quiet && exit 0
          git commit -m "chore: nuevo fondo braille (seed ${{ steps.gen.outputs.seed }})"
          git push
