name: Generate new background

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:        

permissions:
  contents: write           

concurrency:
  group: braille-fondo
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Site Checkout
        uses: actions/checkout@v4

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: finixtavh/braille
          path: generador

      - name: Dependencies
        run: python3 -m pip install numpy pillow && git pull --rebase origin main

      - name: Gen new background
        id: gen
        run: |
          python3 generador/braille_gen.py --font-size 17 \
            --width 2048 --height 10240 --ink white --out-dir /tmp/braille | tee /tmp/gen.log
          SEED=$(grep -oP 'seed: \K[0-9a-f]{8}' /tmp/gen.log | head -1)
          mv /tmp/braille/braille-*-white.png img/braille.png
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"

      - name: Commit y push
        run: |
          git config user.name "finixtavh"
          git config user.email "68766717+finixtavh@users.noreply.github.com"
          git add img/braille.png
          git diff --cached --quiet && exit 0
          git commit -m "chore: new background (seed ${{ steps.gen.outputs.seed }})"
          git push
